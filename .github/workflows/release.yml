name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            binary_name: movefmt-${{ github.ref_name }}-x86_64-unknown-linux-gnu
          
          - os: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu
            binary_name: movefmt-${{ github.ref_name }}-aarch64-unknown-linux-gnu
          
          - os: macos-latest
            rust_target: x86_64-apple-darwin
            binary_name: movefmt-${{ github.ref_name }}-x86_64-apple-darwin
          
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            binary_name: movefmt-${{ github.ref_name }}-aarch64-apple-darwin
          
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            binary_name: movefmt-${{ github.ref_name }}-x86_64-windows.exe

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure cross-compilation (Linux ARM64)
        if: matrix.rust_target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install gcc-aarch64-linux-gnu
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml

      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup component add rust-src
          rustup target add ${{ matrix.rust_target }}

      - name: Build target
        run: |
          cargo build --target ${{ matrix.rust_target }} --release
        env:
          RUSTFLAGS: "-C strip=symbols"

      - name: Prepare artifact
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            cp target/${{ matrix.rust_target }}/release/movefmt.exe ${{ matrix.binary_name }}
          else
            cp target/${{ matrix.rust_target }}/release/movefmt ${{ matrix.binary_name }}
            chmod +x ${{ matrix.binary_name }}
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: movefmt-${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            */*

    